name: CI

# F-B validation gate. The unit suite proves the arg-builder and the sandbox
# dial state machine; the runner-smoke job proves the REAL nsjail binary boots
# and contains untrusted code inside the shipped Docker image. The errno=11
# incident taught the lesson these jobs encode: green unit tests with mocked
# containment are not evidence that the binary jails anything on the target.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-run of the security gates so base-image drift and CVEs disclosed
    # AFTER a merge are caught even when no code changes — the "periodically"
    # half of §4.4 ("rodado no CI e periodicamente"). On this cadence the escape
    # corpus (runner-smoke) and the image CVE scan (security-scan) both fire; a
    # regression in containment or a newly-fixable HIGH/CRITICAL CVE turns the
    # scheduled run red without waiting for the next push.
    - cron: '17 6 * * 1' # Mondays 06:17 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  # S1 — fuzz the pre-jail request validators (path grammar, JSON decode, base64
  # round-trip, entrypoint resolution). These targets assert CONTAINMENT
  # INVARIANTS over pure functions, so a crasher is a security finding (a parser
  # edge case the example tables never sampled), not a flake. `go test -race` in
  # the job above already REPLAYS the committed testdata/fuzz seeds on every run,
  # so a found-and-committed crasher stays red until it is fixed fail-closed; this
  # job does the active SEARCH.
  #
  # Budget: a short per-target run on PRs/pushes catches regressions fast; the
  # weekly schedule (same cadence as the escape corpus) runs a much longer search.
  # This lane is distinct from runner-smoke — it proves the validators, never the
  # sandbox (that is the on-target escape corpus).
  fuzz:
    name: fuzz validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Fuzz the request validators (bounded)
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '15m' || '60s' }}
        run: ./scripts/fuzz.sh

  runner-smoke:
    name: nsjail smoke + escape corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runner image (compiles nsjail from source)
        run: docker build -t runner:smoke .

      # Ubuntu 24.04 (what ubuntu-latest now is) ships
      # kernel.apparmor_restrict_unprivileged_userns=1, an AppArmor mediation
      # that strips CAP_SYS_ADMIN inside unprivileged user namespaces created by
      # unconfined processes — which makes nsjail's own mount setup
      # (`mount('/','/',MS_REC|MS_PRIVATE)`) fail with EPERM. This sysctl is a
      # host-kernel global, NOT container-scoped, so --security-opt
      # apparmor=unconfined on the container cannot lift it; it must be cleared on
      # the runner host (GitHub-hosted runners allow passwordless sudo). This
      # relaxes the CI RUNNER HOST, not the inner jail, and is a property of the
      # runner's OS rather than the production target.
      - name: Allow unprivileged-userns mounts on the runner host (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Boot the shipped image under target-like resource limits with
      # RUNNER_SANDBOX=require, so a failed nsjail boot probe crashes the
      # container instead of silently downgrading to the netns backend.
      #
      # Containment relaxations, and why each is the minimum needed for nsjail to
      # build its per-run jails — all applied to the OUTER container/host only:
      #   --security-opt seccomp=unconfined   default profile blocks the
      #                                        CLONE_NEWUSER unshare nsjail needs
      #                                        to create its user namespace
      #   --security-opt apparmor=unconfined  docker-default apparmor denies the
      #                                        mount ops nsjail performs to build
      #                                        the read-only rootfs + tmpfs /tmp
      #   (host sysctl above)                 lifts Ubuntu 24.04's userns mount
      #                                        restriction
      # None of these add capabilities, and the container still runs as the
      # non-root `runner` user. The INNER per-run jail is unaffected: every
      # submission still gets its own userns/pid/net/mount namespaces, a read-only
      # rootfs, a size-capped tmpfs /tmp, the seccomp denylist, no_new_privs, and
      # per-jail rlimits. The escape corpus below is the proof the jail is intact.
      - name: Boot under target-like limits (RUNNER_SANDBOX=require)
        run: |
          docker run -d --name runner \
            --pids-limit=512 \
            --cpus=1 --memory=512m \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -e RUNNER_ENV=development \
            -e RUNNER_SANDBOX=require \
            -e GOMAXPROCS=1 \
            -p 8090:8090 \
            runner:smoke

      - name: Wait for /healthz (fail-closed boot proves nsjail probe passed)
        run: |
          for i in $(seq 1 40); do
            if curl -fs localhost:8090/healthz >/dev/null; then
              echo "healthz up after $((i))/40 tries"; exit 0
            fi
            if ! docker ps --filter name=runner --filter status=running -q | grep -q .; then
              echo "::error::runner container exited during boot — nsjail require probe failed"
              docker logs runner 2>&1 || true
              exit 1
            fi
            sleep 0.5
          done
          echo "::error::/healthz never came up"; docker logs runner 2>&1 || true; exit 1

      # The boot log is the source of truth that the REAL jail engaged. With
      # RUNNER_SANDBOX=require the daemon cannot reach this state on the netns
      # fallback, but we assert the log line explicitly so a future silent
      # downgrade fails the gate loudly.
      - name: Assert boot log shows nsjail ENABLED
        run: |
          docker logs runner 2>&1 | tee /tmp/boot.log
          if ! grep -q "nsjail ENABLED" /tmp/boot.log; then
            echo "::error::boot log does not show 'nsjail ENABLED' — sandbox did not engage"
            exit 1
          fi

      - name: Real POST /run (Python) — print(2+2) => success / "4\n"
        run: ./scripts/smoke-run.sh python 'print(2+2)' $'4\n'

      - name: Real POST /run (JavaScript) — console.log(2+2) => success / "4\n"
        run: ./scripts/smoke-run.sh javascript 'console.log(2+2)' $'4\n'

      - name: Real POST /run (Lua) — print(2+2) => success / "4\n"
        run: ./scripts/smoke-run.sh lua 'print(2+2)' $'4\n'

      - name: Lua reads stdin (io.read) => "ABC\n"
        run: SMOKE_STDIN='abc' ./scripts/smoke-run.sh lua 'print(io.read("a"):upper())' $'ABC\n'

      # F-C acceptance criterion: JS must INHERIT the jail, not merely run. A Node
      # submission writing outside the tmpfs /tmp is denied by the SAME read-only
      # rootfs that contains Python — proof the containment is language-agnostic
      # (it lives in the sandbox seam, not the runtime).
      - name: JS inherits the jail — host write denied (read-only rootfs)
        run: ./scripts/smoke-run.sh javascript 'try{require("fs").writeFileSync("/usr/pwned","x");console.log("WRITTEN")}catch(e){console.log("denied")}' $'denied\n'

      # F-D: compiled languages compile in one jail and run the STATIC artifact in
      # a separate, minimal-rootfs jail. Prove the full two-phase path end to end.
      - name: Real POST /run (C) — compile + run => success / "4\n"
        run: ./scripts/smoke-run.sh c $'#include <stdio.h>\nint main(void){ printf("4\\n"); return 0; }' $'4\n'

      - name: Real POST /run (C++) — compile + run => success / "4\n"
        run: ./scripts/smoke-run.sh cpp $'#include <iostream>\nint main(){ std::cout << 2+2 << "\\n"; }' $'4\n'

      # A compile failure must short-circuit to compile_error WITHOUT executing.
      - name: C compile error => status compile_error (nothing executed)
        run: ./scripts/smoke-run.sh c 'int main(void){ return }' '' compile_error

      # The compiled run jail is minimal-rootfs: no toolchain is present, so a
      # submission cannot re-invoke the compiler at runtime (D-4). execv of gcc
      # must fail — the program reports the failure rather than compiling anything.
      - name: C run jail has no toolchain (execv gcc fails)
        run: ./scripts/smoke-run.sh c $'#include <unistd.h>\n#include <stdio.h>\nint main(void){ execl("/usr/bin/gcc","gcc",(char*)0); printf("no-gcc\\n"); return 0; }' $'no-gcc\n'

      # ---- G1 executor-robustness acceptance on the shipped image ----

      # G1.1: ordinary C using <math.h> now links libm (-lm rendered AFTER {src})
      # instead of failing as a bogus compile_error — the exact program that
      # regressed during F-D bring-up. `volatile` defeats gcc -O2 constant-folding
      # so a real call to sqrt is emitted and the link against libm is exercised.
      - name: G1.1 C <math.h> links libm => success / "4\n"
        run: ./scripts/smoke-run.sh c $'#include <stdio.h>\n#include <math.h>\nint main(void){ volatile double x = 16.0; printf("%d\\n", (int)sqrt(x)); return 0; }' $'4\n'

      # G1.2: compile_timeout_ms is now honoured (was silently ignored). A 1 ms
      # compile budget cannot finish any real compile, so it deterministically
      # short-circuits to compile_error [compile timed out]; before the fix the
      # field was a no-op and the program would have compiled and succeeded.
      - name: G1.2 compile_timeout_ms honoured => compile_error [compile timed out]
        run: |
          body="$(jq -nc '{language:"c",source_code:"int main(void){return 0;}",compile_timeout_ms:1}')"
          resp="$(curl -fsS localhost:8090/run -H 'content-type: application/json' -d "$body")"
          echo "$resp" | jq '{status, compile_output}'
          echo "$resp" | jq -e '.status=="compile_error" and (.compile_output|contains("[compile timed out]"))' >/dev/null \
            || { echo "::error::compile_timeout_ms not honoured"; exit 1; }

      # G1.3: stdin has its own cap, independent of the source budget. ~40k ints
      # (well over the old 64 KiB body slack) are summed to prove a large judge
      # input flows end to end.
      - name: G1.3 large stdin (>64 KiB) flows end to end => success
        run: |
          SMOKE_STDIN="$(yes 1 | head -n 40000)" \
            ./scripts/smoke-run.sh c $'#include <stdio.h>\nint main(void){ long s=0,x; while(scanf("%ld",&x)==1) s+=x; printf("%ld\\n", s); return 0; }' $'40000\n'

      # G1.3: oversized stdin (> RUNNER_MAX_STDIN_BYTES, default 1 MB) is rejected
      # at the transport layer with 400 — a bad request, not a run outcome.
      - name: G1.3 oversized stdin => 400
        run: |
          big="$(head -c 1100000 /dev/zero | tr '\0' 'x')"
          code="$(jq -nc --arg s "$big" '{language:"python",source_code:"print(1)",stdin:$s}' \
            | curl -sS -o /dev/null -w '%{http_code}' localhost:8090/run -H 'content-type: application/json' -d @-)"
          echo "http_code=$code"
          [ "$code" = "400" ] || { echo "::error::oversized stdin not rejected (got $code)"; exit 1; }

      # G1.4: an unbounded print loop is KILLED the moment it crosses the output
      # cap (SIGKILL of the process group in the REAL jail) and classified
      # output_limit_exceeded, ending far short of the 8 s deadline — not
      # truncated-and-left-running. Proven on both run paths: Python (interpreted)
      # and C (the static-artifact run jail).
      - name: G1.4 Python output flood => output_limit_exceeded, killed under deadline
        run: |
          src=$'while True:\n    print("x" * 1024)'
          body="$(jq -nc --arg s "$src" '{language:"python",source_code:$s,timeout_ms:8000}')"
          resp="$(curl -fsS localhost:8090/run -H 'content-type: application/json' -d "$body")"
          echo "$resp" | jq '{status, duration_ms, stdout_len:(.stdout|length)}'
          echo "$resp" | jq -e '.status=="output_limit_exceeded" and .duration_ms < 4000' >/dev/null \
            || { echo "::error::Python flood not killed fast as output_limit_exceeded"; exit 1; }

      - name: G1.4 C output flood => output_limit_exceeded, killed under deadline
        run: |
          src=$'#include <stdio.h>\nint main(void){ for(;;) putchar(\'x\'); return 0; }'
          body="$(jq -nc --arg s "$src" '{language:"c",source_code:$s,timeout_ms:8000}')"
          resp="$(curl -fsS localhost:8090/run -H 'content-type: application/json' -d "$body")"
          echo "$resp" | jq '{status, duration_ms, stdout_len:(.stdout|length)}'
          echo "$resp" | jq -e '.status=="output_limit_exceeded" and .duration_ms < 4000' >/dev/null \
            || { echo "::error::C flood not killed fast as output_limit_exceeded"; exit 1; }

      # Regression: output strictly under the cap is still a clean success with
      # full output (the kill path must not fire early).
      - name: G1.4 output under the cap => success, full output
        run: ./scripts/smoke-run.sh python 'print("y" * 1000)' "$(printf 'y%.0s' $(seq 1000))"$'\n'

      # ---- G2.1 Go (static-compiled) on the shipped image ----

      # Ordinary Go: goroutines + channels + a stdlib sort, compiled in the compile
      # jail (seeding its GOCACHE from the pre-warmed /opt/gocache) and run as a
      # static artifact in the minimal-rootfs run jail — proving the whole two-jail
      # Go path end to end.
      - name: G2.1 Go success (goroutines + channels + sort) => "6\n"
        run: |
          src=$'package main\nimport ("fmt"; "sort")\nfunc main(){\n ch := make(chan int, 3)\n for _, v := range []int{3, 1, 2} { go func(x int){ ch <- x }(v) }\n s := []int{}\n for i := 0; i < 3; i++ { s = append(s, <-ch) }\n sort.Ints(s)\n fmt.Println(s[0] + s[1] + s[2])\n}'
          ./scripts/smoke-run.sh go "$src" $'6\n'

      # Go reads stdin like any other run path (shared execute()).
      - name: G2.1 Go reads stdin => sum
        run: |
          src=$'package main\nimport ("bufio"; "fmt"; "os"; "strconv")\nfunc main(){\n sc := bufio.NewScanner(os.Stdin)\n n := 0\n for sc.Scan() { v, _ := strconv.Atoi(sc.Text()); n += v }\n fmt.Println(n)\n}'
          SMOKE_STDIN="$(printf '10\n20\n12\n')" ./scripts/smoke-run.sh go "$src" $'42\n'

      # Go inherits the jail's empty netns: any outbound dial fails, so egress is
      # contained (the program reports "blocked", never "OPEN").
      - name: G2.1 Go egress contained (empty netns) => "blocked\n"
        run: |
          src=$'package main\nimport ("fmt"; "net"; "time")\nfunc main(){\n _, err := net.DialTimeout("tcp", "1.1.1.1:80", 2*time.Second)\n if err != nil { fmt.Println("blocked") } else { fmt.Println("OPEN") }\n}'
          ./scripts/smoke-run.sh go "$src" $'blocked\n'

      # Go infinite loop is stopped by the wall/CPU limit, reported as timeout.
      - name: G2.1 Go infinite loop => timeout
        run: |
          src=$'package main\nfunc main(){ for {} }'
          body="$(jq -nc --arg s "$src" '{language:"go",source_code:$s,timeout_ms:2000}')"
          resp="$(curl -fsS localhost:8090/run -H 'content-type: application/json' -d "$body")"
          echo "$resp" | jq '{status, duration_ms}'
          echo "$resp" | jq -e '.status=="timeout"' >/dev/null \
            || { echo "::error::Go infinite loop not stopped by timeout"; exit 1; }

      # A Go compile error short-circuits to compile_error WITHOUT executing.
      - name: G2.1 Go compile error => compile_error (nothing executed)
        run: ./scripts/smoke-run.sh go $'package main\nfunc main(){ undefined() }' '' compile_error

      # ---- G2.2 Java (VM-compiled) on the shipped image ----

      # Ordinary Java: javac compiles Main.java to bytecode in the compile jail, then
      # the JVM runs it on the FULL-rootfs denylist jail (the third runtime shape) —
      # println + Collections.sort proving the whole javac->JVM path end to end.
      - name: G2.2 Java success (Collections.sort) => "6\n"
        run: |
          src=$'import java.util.*;\npublic class Main {\n public static void main(String[] a) {\n  List<Integer> xs = new ArrayList<>(List.of(3, 1, 2));\n  Collections.sort(xs);\n  System.out.println(xs.get(0) + xs.get(1) + xs.get(2));\n }\n}'
          ./scripts/smoke-run.sh java "$src" $'6\n'

      # Java reads stdin via Scanner (shared execute() stdin path).
      - name: G2.2 Java reads stdin (Scanner) => sum
        run: |
          src=$'import java.util.Scanner;\npublic class Main {\n public static void main(String[] a) {\n  Scanner s = new Scanner(System.in);\n  int n = 0; while (s.hasNextInt()) n += s.nextInt();\n  System.out.println(n);\n }\n}'
          SMOKE_STDIN="$(printf '10 20 12\n')" ./scripts/smoke-run.sh java "$src" $'42\n'

      # Java inherits the jail's empty netns: an outbound Socket connect fails, so
      # egress is contained (prints "blocked", never "OPEN").
      - name: G2.2 Java egress contained (empty netns) => "blocked\n"
        run: |
          src=$'import java.net.*;\npublic class Main {\n public static void main(String[] a) {\n  try (Socket s = new Socket()) {\n   s.connect(new InetSocketAddress("1.1.1.1", 80), 2000);\n   System.out.println("OPEN");\n  } catch (Exception e) {\n   System.out.println("blocked");\n  }\n }\n}'
          ./scripts/smoke-run.sh java "$src" $'blocked\n'

      # Java infinite loop is stopped by the wall/CPU limit, reported as timeout.
      - name: G2.2 Java infinite loop => timeout
        run: |
          src=$'public class Main { public static void main(String[] a){ while(true){} } }'
          body="$(jq -nc --arg s "$src" '{language:"java",source_code:$s,timeout_ms:3000}')"
          resp="$(curl -fsS localhost:8090/run -H 'content-type: application/json' -d "$body")"
          echo "$resp" | jq '{status, duration_ms}'
          echo "$resp" | jq -e '.status=="timeout"' >/dev/null \
            || { echo "::error::Java infinite loop not stopped by timeout"; exit 1; }

      # A Java compile error short-circuits to compile_error WITHOUT executing.
      - name: G2.2 Java compile error => compile_error (nothing executed)
        run: ./scripts/smoke-run.sh java $'public class Main { public static void main(String[] a){ undefined(); } }' '' compile_error

      # ---- G4 observability on the shipped image ----

      # G4.3: /readyz is 200 because nsjail is the active backend (RUNNER_SANDBOX=
      # require); it reports the resolved posture. Distinct from /healthz (liveness).
      - name: G4.3 /readyz reports nsjail posture => 200
        run: |
          code="$(curl -s -o /tmp/ready.json -w '%{http_code}' localhost:8090/readyz)"
          cat /tmp/ready.json; echo
          [ "$code" = "200" ] || { echo "::error::/readyz not 200 with nsjail active (got $code)"; exit 1; }
          jq -e '.ready == true and .backend == "nsjail"' /tmp/ready.json >/dev/null \
            || { echo "::error::/readyz body did not report nsjail posture"; exit 1; }

      # G4.2: an inbound X-Request-ID is echoed on the response, stitching the
      # backend's trace to the runner's per-run log line.
      - name: G4.2 X-Request-ID is echoed
        run: |
          echoed="$(curl -fsS -D - -o /dev/null -H 'X-Request-ID: smoke-trace-42' \
            -H 'content-type: application/json' -d '{"language":"python","source_code":"print(1)"}' \
            localhost:8090/run | tr -d '\r' | awk -F': ' 'tolower($1)=="x-request-id"{print $2}')"
          echo "echoed=[$echoed]"
          [ "$echoed" = "smoke-trace-42" ] || { echo "::error::X-Request-ID not echoed"; exit 1; }

      # G4.1: /metrics exposes the recorded series after the runs above. The smoke
      # runner boots RUNNER_ENV=development with no token, so the gate is a dev
      # pass-through here; production gates it behind the service/metrics token.
      - name: G4.1 /metrics exposes recorded series
        run: |
          body="$(curl -fsS localhost:8090/metrics)"
          echo "$body" | grep -E '^runner_runs_total\{' | head
          echo "$body" | grep -q '^runner_runs_total{language="python",status="success"}' \
            || { echo "::error::/metrics missing runner_runs_total series"; exit 1; }
          echo "$body" | grep -q '^runner_run_duration_seconds_bucket{' \
            || { echo "::error::/metrics missing run-duration histogram"; exit 1; }

      # ---- G3 multi-file submissions (files[]) on the shipped image ----
      # These exercise the ONLY contract change of the phase end to end through the
      # real jail: files[] materialized into /sandbox/src with the traversal-resistant
      # writer, then compiled/run per language. Single-file source_code (every step
      # above) is the regression guard that the legacy path is unchanged.

      - name: G3 C multi-file (.h + 2 .c TUs) => "5\n"
        run: |
          SMOKE_FILES='[
            {"path":"util.h","content":"int add(int,int);\n"},
            {"path":"util.c","content":"#include \"util.h\"\nint add(int a,int b){return a+b;}\n"},
            {"path":"main.c","content":"#include <stdio.h>\n#include \"util.h\"\nint main(void){printf(\"%d\\n\", add(2,3));return 0;}\n"}
          ]' ./scripts/smoke-files.sh c $'5\n'

      - name: G3 C++ multi-file (.hpp + 2 .cpp) => "9\n"
        run: |
          SMOKE_FILES='[
            {"path":"solver.hpp","content":"int mul(int,int);\n"},
            {"path":"solver.cpp","content":"#include \"solver.hpp\"\nint mul(int a,int b){return a*b;}\n"},
            {"path":"main.cpp","content":"#include <iostream>\n#include \"solver.hpp\"\nint main(){std::cout<<mul(3,3)<<\"\\n\";}\n"}
          ]' ./scripts/smoke-files.sh cpp $'9\n'

      - name: G3 Go multi-file (two files, one package) => "9\n"
        run: |
          SMOKE_FILES='[
            {"path":"main.go","content":"package main\nimport \"fmt\"\nfunc main(){fmt.Printf(\"%d\\n\", add(4,5))}\n"},
            {"path":"helper.go","content":"package main\nfunc add(a,b int) int {return a+b}\n"}
          ]' ./scripts/smoke-files.sh go $'9\n'

      - name: G3 Java multi-file (package + helper class, entrypoint com.acme.Main) => "42\n"
        run: |
          SMOKE_FILES='[
            {"path":"com/acme/Helper.java","content":"package com.acme;\npublic class Helper { public static int n(){ return 42; } }\n"},
            {"path":"com/acme/Main.java","content":"package com.acme;\npublic class Main { public static void main(String[] a){ System.out.println(Helper.n()); } }\n"}
          ]' ./scripts/smoke-files.sh java $'42\n' success com.acme.Main

      - name: G3 Python multi-file (sibling import via runpy wrapper) => "hello world\n"
        run: |
          SMOKE_FILES='[
            {"path":"main.py","content":"from helper import greet\nprint(greet(\"world\"))\n"},
            {"path":"helper.py","content":"def greet(n):\n    return \"hello \" + n\n"}
          ]' ./scripts/smoke-files.sh python $'hello world\n'

      - name: G3 JavaScript multi-file (sibling require) => "hello world\n"
        run: |
          SMOKE_FILES='[
            {"path":"main.js","content":"const {greet}=require(\"./helper\");console.log(greet(\"world\"));\n"},
            {"path":"helper.js","content":"module.exports.greet=(n)=>\"hello \"+n;\n"}
          ]' ./scripts/smoke-files.sh javascript $'hello world\n'

      - name: G3 Lua multi-file (sibling require via package.path) => "hello world\n"
        run: |
          SMOKE_FILES='[
            {"path":"main.lua","content":"local h=require(\"helper\")\nprint(h.greet(\"world\"))\n"},
            {"path":"helper.lua","content":"local M={}\nfunction M.greet(n) return \"hello \"..n end\nreturn M\n"}
          ]' ./scripts/smoke-files.sh lua $'hello world\n'

      # The security crux: an attacker-controlled path that tries to escape the job
      # root must be REJECTED with 400 before anything is written or run. A
      # forbidden manifest (setup.py / go.mod) is likewise a 400.
      - name: G3 path traversal + forbidden file => HTTP 400 (nothing materialized)
        run: |
          for body in \
            '{"language":"python","files":[{"path":"../../etc/passwd","content":"x"}]}' \
            '{"language":"python","files":[{"path":"/etc/passwd","content":"x"}]}' \
            '{"language":"go","files":[{"path":"go.mod","content":"module x"},{"path":"main.go","content":"package main\nfunc main(){}"}]}' \
            '{"language":"python","files":[{"path":"setup.py","content":"x"}]}'; do
            code="$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/run \
              -H 'content-type: application/json' -d "$body")"
            if [ "$code" != "400" ]; then
              echo "::error::expected 400 for hostile files[] payload, got $code: $body"; exit 1
            fi
          done
          echo "SMOKE OK   [G3] hostile files[] payloads all rejected with 400"

      # ---- G6 batch execution (stdins[]) on the shipped image ----
      # One program, N inputs: compiled once, executed once per element, each in
      # a fresh jail. The envelope carries the shared compile telemetry once and
      # index-aligned raw results.

      - name: G6 C batch — compile once, run per stdin, index-aligned
        run: |
          src=$'#include <stdio.h>\nint main(void){ int a,b; scanf("%d %d",&a,&b); printf("%d\\n", a+b); return 0; }'
          body="$(jq -nc --arg s "$src" '{language:"c",source_code:$s,stdins:["1 2","3 4","5 6"]}')"
          resp="$(curl -fsS localhost:8090/run -H 'content-type: application/json' -d "$body")"
          echo "$resp" | jq '{status, compile_ms, aborted, stdouts:[.results[].stdout]}'
          echo "$resp" | jq -e '
            .status=="ok" and .compile_ms > 0 and (.aborted // false | not)
            and (.results | length) == 3
            and .results[0].stdout=="3\n" and .results[1].stdout=="7\n" and .results[2].stdout=="11\n"
            and ([.results[].compile_ms // 0] | add) == 0' >/dev/null \
            || { echo "::error::batch envelope wrong (compile-once / index alignment)"; exit 1; }

      # The batch isolation crux: inputs share the prepared workDir (that is the
      # amortization) but each runs in a NEW jail with its own tmpfs /tmp and a
      # read-only /sandbox — nothing an input does may be visible to the next.
      - name: G6 batch isolation — no state survives between inputs
        run: |
          src=$'import sys, os\ns = sys.stdin.read().strip()\nif s == "write":\n    open("/tmp/mark","w").write("x")\n    print("wrote")\nelse:\n    print(os.path.exists("/tmp/mark"))'
          body="$(jq -nc --arg s "$src" '{language:"python",source_code:$s,stdins:["write","read"]}')"
          resp="$(curl -fsS localhost:8090/run -H 'content-type: application/json' -d "$body")"
          echo "$resp" | jq '{status, stdouts:[.results[].stdout]}'
          echo "$resp" | jq -e '.results[0].stdout=="wrote\n" and .results[1].stdout=="False\n"' >/dev/null \
            || { echo "::error::state leaked between batch inputs — cross-input isolation broken"; exit 1; }

      # DoS caps: over-count batches and stdin+stdins together are 400s at the
      # gate, before anything compiles or runs.
      - name: G6 batch caps — oversize batch and stdin+stdins => 400
        run: |
          over="$(jq -nc '{language:"python",source_code:"print(1)",stdins:[range(101)|tostring]}')"
          both='{"language":"python","source_code":"print(1)","stdin":"a","stdins":["b"]}'
          for body in "$over" "$both"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/run \
              -H 'content-type: application/json' -d "$body")"
            [ "$code" = "400" ] || { echo "::error::expected 400 for hostile batch payload, got $code"; exit 1; }
          done
          echo "SMOKE OK   [G6] batch caps rejected with 400"

      # ---- G9 test-runner mode (mode=test) on the shipped image ----
      # A mode=test request runs the language's own test framework over files[] and
      # returns its machine-readable report RAW, plus tests_failed/success — the
      # framework judges, the runner only transcribes. These run under the REAL
      # nsjail jail, so they prove the report hand-back over the writable /sandbox
      # bind (a path the unit suite's netns backend does not exercise) and that a
      # writable /sandbox did NOT open the read-only rootfs.

      - name: G9 python pytest — all pass => success + raw junit report
        run: |
          SMOKE_FILES='[
            {"path":"solution.py","content":"def add(a, b):\n    return a + b\n"},
            {"path":"test_solution.py","content":"from solution import add\ndef test_a():\n    assert add(2, 3) == 5\ndef test_b():\n    assert add(0, 0) == 0\n"}
          ]' ./scripts/smoke-test.sh python success junit-xml

      - name: G9 python pytest — some fail => tests_failed (NOT runtime_error)
        run: |
          SMOKE_FILES='[
            {"path":"solution.py","content":"def add(a, b):\n    return a + b\n"},
            {"path":"test_solution.py","content":"from solution import add\ndef test_ok():\n    assert add(2, 3) == 5\ndef test_bad():\n    assert add(2, 3) == 6\n"}
          ]' ./scripts/smoke-test.sh python tests_failed junit-xml

      # Containment crux for test mode: /sandbox is writable so the framework can
      # hand its report back, but the host rootfs stays READ-ONLY and the netns
      # stays empty. The hidden test asserts a host write is denied and egress has
      # no route; if either leaked the assertion would fail and the suite would come
      # back tests_failed, so status==success IS the containment proof.
      - name: G9 test mode containment — writable /sandbox did not open the rootfs/net
        run: |
          SMOKE_FILES='[
            {"path":"test_contain.py","content":"import socket\ndef test_no_host_write():\n    try:\n        open(\"/usr/pwned\", \"w\").write(\"x\")\n        assert False, \"host write succeeded\"\n    except OSError:\n        pass\ndef test_no_egress():\n    s = socket.socket(); s.settimeout(2)\n    try:\n        s.connect((\"1.1.1.1\", 53)); assert False, \"egress reached\"\n    except OSError:\n        pass\n"}
          ]' ./scripts/smoke-test.sh python success junit-xml

      # A collection/import error is a harness crash, not a test failure: exit 2 is
      # not the tests-failed code, so it classifies runtime_error, distinct from
      # tests_failed — the backend must not read it as "the student failed a test".
      - name: G9 python pytest — import error => runtime_error
        run: |
          SMOKE_FILES='[
            {"path":"test_broken.py","content":"import definitely_missing_xyz\ndef test_x():\n    assert True\n"}
          ]' ./scripts/smoke-test.sh python runtime_error junit-xml

      # mode=test is admitted only for a language with a test command registered,
      # and never for a stdins[] batch — both are 400s at the gate.
      - name: G9 test mode guards — unsupported language and batch => 400
        run: |
          for body in \
            '{"language":"lua","mode":"test","files":[{"path":"main.lua","content":"print(1)"}]}' \
            '{"language":"c","mode":"test","source_code":"int main(void){return 0;}"}' \
            '{"language":"python","mode":"test","source_code":"def test_x():\n    assert True","stdins":["a","b"]}' \
            '{"language":"python","mode":"weird","source_code":"print(1)"}'; do
            code="$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/run \
              -H 'content-type: application/json' -d "$body")"
            [ "$code" = "400" ] || { echo "::error::expected 400 for bad mode=test payload, got $code: $body"; exit 1; }
          done
          echo "SMOKE OK   [G9] test-mode guards rejected with 400"

      # G7: execution determinism. LANG/LC_ALL/TZ are pinned identically in every
      # language's run env, so a fixed epoch formatted as LOCAL time (TZ=UTC) and
      # the reported LANG are IDENTICAL across all six runtimes. Each snippet must
      # print exactly:  "1970-01-01 00:00:00\nLANG=C.UTF-8\n". Seven languages now.
      - name: G7 determinism — locale/TZ identical across all languages
        run: |
          EXP=$'1970-01-01 00:00:00\nLANG=C.UTF-8\n'
          ./scripts/smoke-run.sh python $'import os, time\nprint(time.strftime("%Y-%m-%d %H:%M:%S", time.localtime(0)))\nprint("LANG=" + os.environ.get("LANG", ""))' "$EXP"
          ./scripts/smoke-run.sh javascript $'const d=new Date(0);const p=n=>String(n).padStart(2,"0");\nconsole.log(`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`);\nconsole.log("LANG="+(process.env.LANG||""));' "$EXP"
          ./scripts/smoke-run.sh c $'#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\nint main(void){ time_t t=0; char b[64]; strftime(b,sizeof b,"%Y-%m-%d %H:%M:%S",localtime(&t)); printf("%s\\n", b); printf("LANG=%s\\n", getenv("LANG")); return 0; }' "$EXP"
          ./scripts/smoke-run.sh cpp $'#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\nint main(){ time_t t=0; char b[64]; strftime(b,sizeof b,"%Y-%m-%d %H:%M:%S",localtime(&t)); printf("%s\\n", b); printf("LANG=%s\\n", getenv("LANG")); return 0; }' "$EXP"
          ./scripts/smoke-run.sh go $'package main\nimport ("fmt";"os";"time")\nfunc main(){ t:=time.Unix(0,0); fmt.Println(t.Format("2006-01-02 15:04:05")); fmt.Println("LANG="+os.Getenv("LANG")) }' "$EXP"
          ./scripts/smoke-run.sh java $'import java.time.*;\nimport java.time.format.*;\npublic class Main { public static void main(String[] a){ LocalDateTime dt=LocalDateTime.ofInstant(Instant.ofEpochSecond(0), ZoneId.systemDefault()); System.out.println(dt.format(DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss"))); System.out.println("LANG="+System.getenv("LANG")); } }' "$EXP"
          ./scripts/smoke-run.sh lua $'print(os.date("%Y-%m-%d %H:%M:%S", 0))\nprint("LANG=" .. (os.getenv("LANG") or ""))' "$EXP"
          echo "SMOKE OK   [G7] locale/TZ pinned identically across all seven languages"

      # F-D follow-up: the static run jail can take a tight seccomp ALLOWLIST
      # (DEFAULT KILL) instead of the shared denylist. Prove on a dedicated
      # RUNNER_STATIC_SECCOMP=enforce container that (a) the kafel allowlist
      # compiles and (b) it is sufficient for ordinary C and C++ programs — a run
      # killed by SIGSYS would come back != success. A separate container because
      # enforce changes the run jail for every compiled run (the execl test above
      # would be SIGSYS-killed, not ENOENT).
      - name: Static seccomp allowlist — enforce mode runs C/C++
        run: |
          docker run -d --name runner-seccomp \
            --pids-limit=512 --cpus=1 --memory=512m \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -e RUNNER_ENV=development \
            -e RUNNER_SANDBOX=require \
            -e RUNNER_STATIC_SECCOMP=enforce \
            -e GOMAXPROCS=1 \
            -p 8092:8090 \
            runner:smoke
          for i in $(seq 1 40); do
            if curl -fs localhost:8092/healthz >/dev/null; then break; fi
            if ! docker ps --filter name=runner-seccomp --filter status=running -q | grep -q .; then
              echo "::error::runner-seccomp exited during boot"; docker logs runner-seccomp 2>&1 || true; exit 1
            fi
            sleep 0.5
          done
          docker logs runner-seccomp 2>&1 | grep -q "static seccomp ALLOWLIST enforced" \
            || { echo "::error::enforce mode did not engage"; docker logs runner-seccomp 2>&1 || true; exit 1; }
          # On a SIGSYS kill (DEFAULT KILL) the kernel audit logs syscall=NNN to the
          # host dmesg — dump it so a missing allowlist entry is self-diagnosing.
          seccomp_run() {
            RUNNER_URL=http://localhost:8092 ./scripts/smoke-run.sh "$@" || {
              echo "::error::allowlist rejected a needed syscall — recent seccomp audit lines:";
              sudo dmesg | grep -iE 'seccomp|type=1326' | tail -20 || true;
              return 1;
            }
          }
          seccomp_run c $'#include <stdio.h>\nint main(void){ printf("4\\n"); return 0; }' $'4\n'
          seccomp_run cpp $'#include <iostream>\nint main(){ std::cout << 2+2 << "\\n"; }' $'4\n'
          # G4.4: a program calling a DENIED syscall under the allowlist (socket is
          # not in the static set) must be killed (SIGSYS), NOT run to success — the
          # allowlist's teeth, asserted on every build.
          resp="$(curl -fsS http://localhost:8092/run -H 'content-type: application/json' \
            -d "$(jq -nc '{language:"c",source_code:"#include <sys/socket.h>\nint main(void){ socket(AF_INET,SOCK_STREAM,0); return 0; }"}')")"
          echo "$resp" | jq '{status, signal}'
          echo "$resp" | jq -e '.status != "success" and (.signal=="SIGSYS" or .status=="runtime_error")' >/dev/null \
            || { echo "::error::denied syscall (socket) was not killed under the enforce allowlist"; exit 1; }
          docker rm -f runner-seccomp

      - name: Escape corpus — every submission must be contained, host survives
        run: ./scripts/smoke-escape.sh

      # Backpressure (R5 / F-A) on the shipped image. A dedicated container with
      # RUNNER_MAX_CONCURRENT_RUNS=1 (on port 8091) makes saturation
      # deterministic: firing several concurrent runs proves the excess is shed
      # immediately with 503 + Retry-After instead of queueing or knocking the
      # daemon over. Independent of the jail, but run through it (SANDBOX=require).
      - name: Backpressure — 503 + Retry-After under a low concurrency cap
        run: |
          docker run -d --name runner-bp \
            --pids-limit=512 --cpus=1 --memory=512m \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -e RUNNER_ENV=development \
            -e RUNNER_SANDBOX=require \
            -e RUNNER_MAX_CONCURRENT_RUNS=1 \
            -e GOMAXPROCS=1 \
            -p 8091:8090 \
            runner:smoke
          for i in $(seq 1 40); do
            if curl -fs localhost:8091/healthz >/dev/null; then break; fi
            if ! docker ps --filter name=runner-bp --filter status=running -q | grep -q .; then
              echo "::error::runner-bp exited during boot"; docker logs runner-bp 2>&1 || true; exit 1
            fi
            sleep 0.5
          done
          RUNNER_URL=http://localhost:8091 ./scripts/smoke-stress.sh 1

      - name: Runner logs (always)
        if: always()
        run: |
          echo "=== runner ==="; docker logs runner 2>&1 || true
          echo "=== runner-bp ==="; docker logs runner-bp 2>&1 || true
          echo "=== runner-seccomp ==="; docker logs runner-seccomp 2>&1 || true

      - name: Teardown
        if: always()
        run: docker rm -f runner runner-bp runner-seccomp || true

  # ---------------------------------------------------------------------------
  # Memory-containment proof for the RLIMIT_AS-incompatible runtimes (Go, JS,
  # Java). These opt OUT of RLIMIT_AS (capAddressSpace:false) — they reserve a
  # huge virtual cage a tight RLIMIT_AS refuses — so their memory bound is the
  # delegated cgroup v2 memory.max, NOT rlimits. The default runner-smoke job runs
  # cgroup=auto (rlimit-only, no delegated cgroup), so a Go/JS/Java memory bomb
  # there is NOT contained as memory_exceeded — which is exactly why the escape
  # corpus skips them in that context. This job closes that gap IN CI by engaging a
  # REAL delegated cgroup with the SAME mechanism the prod R6 VPS uses
  # (RUNNER_CGROUP=require + --cgroup-parent, cgroupfs driver — see docs/DEPLOY.md
  # §8b), so memory.max is authoritative and the bombs are contained + classified
  # from the kernel OOM event.
  #
  # It is FAIL-CLOSED end to end: RUNNER_CGROUP=require means the container refuses
  # to boot if the delegated cgroup did not truly engage, and the boot-log +
  # /readyz assertions below reject a silent downgrade — so this job can never
  # report a false green. If a future GitHub-hosted-runner change makes cgroup
  # delegation impossible here, this job reds LOUDLY (an honest infra signal), and
  # the guarantee still holds on-target via `deploy/deploy.sh verify` on the VPS.
  runner-smoke-cgroup:
    name: cgroup mem-containment (go/js/java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runner image (compiles nsjail from source)
        run: docker build -t runner:smoke .

      # Same Ubuntu 24.04 userns-mount relaxation the default smoke job needs (host
      # sysctl, not container-scoped) so nsjail can build its per-run jails.
      - name: Allow unprivileged-userns mounts on the runner host (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # --cgroup-parent=/dalivim (a raw cgroup path) needs Docker's cgroupfs driver;
      # the GitHub-hosted runner defaults to the systemd driver. Switch it on this
      # single-purpose runner VM exactly as docs/DEPLOY.md §8b documents for a
      # cgroupfs-driver box, then restart docker. (Isolated to THIS job's VM.)
      - name: Use the cgroupfs cgroup driver (needed for --cgroup-parent=/dalivim)
        run: |
          echo '{ "exec-opts": ["native.cgroupdriver=cgroupfs"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          driver="$(docker info --format '{{.CgroupDriver}}')"
          version="$(docker info --format '{{.CgroupVersion}}')"
          echo "docker cgroup driver=$driver version=$version"
          [ "$driver" = cgroupfs ] || { echo "::error::docker cgroup driver is $driver, not cgroupfs"; exit 1; }
          [ "$version" = 2 ] || { echo "::error::host is cgroup v$version, not v2 — cannot delegate a v2 subtree"; exit 1; }

      # Delegate a writable cgroup v2 subtree to the runner's in-container uid, with
      # +memory +pids in its subtree_control, so the runner can give each run a leaf
      # cgroup with an authoritative memory.max. The uid is read from the image (not
      # hardcoded) so a base-image user change can't silently mis-chown the subtree.
      - name: Delegate a cgroup v2 subtree to the runner uid
        run: |
          # Ensure the controllers are available to enable in the child subtree
          # (best-effort at root; on a cgroupfs host they are usually already there).
          echo "+memory +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null 2>&1 || true
          sudo mkdir -p /sys/fs/cgroup/dalivim
          echo "+memory +pids" | sudo tee /sys/fs/cgroup/dalivim/cgroup.subtree_control
          RUID="$(docker run --rm --entrypoint id runner:smoke -u)"
          echo "runner in-container uid=$RUID"
          sudo chown -R "$RUID:$RUID" /sys/fs/cgroup/dalivim
          # Pre-flight: the delegation must actually carry memory+pids, else the boot
          # below would fail-close for a reason that is easy to misread. Assert it
          # here so a delegation failure is self-diagnosing (infra), distinct from a
          # containment failure (the bombs).
          sc="$(cat /sys/fs/cgroup/dalivim/cgroup.subtree_control)"
          echo "dalivim subtree_control: [$sc]"
          echo "$sc" | grep -qw memory || { echo "::error::memory controller not delegated to /sys/fs/cgroup/dalivim"; exit 1; }
          echo "$sc" | grep -qw pids   || { echo "::error::pids controller not delegated to /sys/fs/cgroup/dalivim"; exit 1; }

      # Boot the shipped image INSIDE the delegated subtree (--cgroup-parent=/dalivim
      # puts the container's own cgroup under it, so CLONE_INTO_CGROUP shares a
      # writable ancestor with the per-run leaves) with RUNNER_CGROUP=require so a
      # cgroup that did not truly engage fails the boot closed instead of downgrading.
      - name: Boot with a delegated cgroup engaged (RUNNER_CGROUP=require)
        run: |
          docker run -d --name runner-cg \
            --cgroup-parent=/dalivim \
            --cgroupns=host \
            -v /sys/fs/cgroup/dalivim:/sys/fs/cgroup/dalivim \
            --pids-limit=512 \
            --cpus=1 --memory=1g \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -e RUNNER_ENV=development \
            -e RUNNER_SANDBOX=require \
            -e RUNNER_CGROUP=require \
            -e RUNNER_CGROUP_MOUNT=/sys/fs/cgroup/dalivim \
            -e GOMAXPROCS=1 \
            -p 8090:8090 \
            runner:smoke

      - name: Wait for /healthz (fail-closed boot proves nsjail + cgroup engaged)
        run: |
          for i in $(seq 1 40); do
            if curl -fs localhost:8090/healthz >/dev/null; then
              echo "healthz up after $((i))/40 tries"; exit 0
            fi
            if ! docker ps --filter name=runner-cg --filter status=running -q | grep -q .; then
              echo "::error::runner-cg exited during boot — RUNNER_CGROUP=require could not engage the delegated cgroup"
              docker logs runner-cg 2>&1 || true
              exit 1
            fi
            sleep 0.5
          done
          echo "::error::/healthz never came up"; docker logs runner-cg 2>&1 || true; exit 1

      # The boot log is the source of truth that BOTH the jail AND the per-run cgroup
      # engaged. Without the cgroup line, memory.max is not authoritative and the
      # go/js/java bombs below would not be contained — assert it explicitly.
      - name: Assert boot log shows nsjail ENABLED + cgroup memory accounting ENABLED
        run: |
          docker logs runner-cg 2>&1 | tee /tmp/boot-cg.log
          grep -q "nsjail ENABLED" /tmp/boot-cg.log \
            || { echo "::error::boot log missing 'nsjail ENABLED'"; exit 1; }
          grep -q "cgroup memory accounting ENABLED" /tmp/boot-cg.log \
            || { echo "::error::boot log missing 'cgroup memory accounting ENABLED' — delegation did not take"; exit 1; }

      # /readyz must report the cgroup-v2 posture — this is exactly what the escape
      # corpus probes to decide it can assert the go/js/java memory bombs here.
      - name: Assert /readyz reports cgroup-v2 memory accounting
        run: |
          curl -s localhost:8090/readyz | tee /tmp/ready-cg.json; echo
          jq -e '.ready == true and .backend == "nsjail" and (.memory_accounting | test("^cgroup-v2"))' /tmp/ready-cg.json >/dev/null \
            || { echo "::error::/readyz did not report cgroup-v2 memory accounting"; exit 1; }

      # Explicit, per-language proof (clear failure point): each RLIMIT_AS-incompatible
      # runtime's memory bomb allocates real pages the per-run cgroup memory.max must
      # stop, and MUST be classified memory_exceeded from the kernel OOM event — the
      # exact guarantee cgroup=auto CI cannot make. The container stays up (host
      # survives): the per-run leaf OOMs, not the 1g container.
      - name: Go/JS/Java memory bombs => memory_exceeded (cgroup memory.max)
        run: |
          bomb() { # <lang> <source>
            local lang="$1" src="$2" resp
            resp="$(jq -nc --arg l "$lang" --arg s "$src" '{language:$l,source_code:$s,timeout_ms:8000}' \
              | curl -fsS localhost:8090/run -H 'content-type: application/json' -d @-)"
            echo "$resp" | jq '{lang:"'"$lang"'", status, duration_ms, peak_mem:.memory_kb}'
            echo "$resp" | jq -e '.status=="memory_exceeded"' >/dev/null \
              || { echo "::error::$lang memory bomb was not contained as memory_exceeded"; exit 1; }
          }
          bomb go         'package main
          func main(){ var k [][]byte; for { b:=make([]byte,64*1024*1024); for i:=0;i<len(b);i+=4096 { b[i]=1 }; k=append(k,b) } }'
          bomb javascript 'const k=[];for(;;){k.push(Buffer.alloc(64*1024*1024,1));}'
          bomb java       'import java.util.*;
          public class Main { public static void main(String[] a){ List<byte[]> k=new ArrayList<>(); for(;;){ k.add(new byte[64*1024*1024]); } } }'
          echo "SMOKE OK   [R6] go/js/java memory bombs contained as memory_exceeded on the delegated cgroup"

      # And the full escape corpus, which — seeing memory_accounting=cgroup-v2 on
      # /readyz — now RUNS the go/js/java memory-bomb cases (not the explicit-skip
      # branch) and asserts them alongside every other containment guarantee. The
      # host-survival gate at its end proves the daemon outlived the whole corpus.
      - name: Escape corpus (cgroup engaged — go/js/java bombs asserted here)
        run: ./scripts/smoke-escape.sh

      - name: Runner logs (always)
        if: always()
        run: docker logs runner-cg 2>&1 || true

      - name: Teardown
        if: always()
        run: |
          docker rm -f runner-cg || true
          sudo rmdir /sys/fs/cgroup/dalivim 2>/dev/null || true

  # §4.5(c) — image CVE scan. A separate job (not a step in runner-smoke) so a
  # CVE finding gives a clean, independent signal instead of muddying the
  # functional/containment smoke result, and so it can run on its own cadence via
  # the weekly schedule above. Scans the SHIPPED image, so it also covers the
  # runtimes and nsjail runtime libs the Dockerfile installs (and the Node/gcc
  # toolchains F-C/F-D will add).
  security-scan:
    name: image CVE scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runner image
        run: docker build -t runner:scan .

      - name: Install trivy
        # Official installer, pinned to /usr/local/bin. Avoids depending on a
        # marketplace-action tag existing; the vuln DB is pulled at scan time.
        #
        # The installer resolves trivy's latest tag via the GitHub API; unauthenticated
        # that call is IP-rate-limited on shared runners and returns an empty tag
        # ("unable to find ''"), failing the job for a reason unrelated to any CVE. Pass
        # GITHUB_TOKEN so the lookup is authenticated, and retry with backoff so a
        # transient blip doesn't red the gate.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                 | sh -s -- -b /usr/local/bin && trivy --version; then
              exit 0
            fi
            echo "trivy install attempt $i failed; retrying in $((i*5))s..."; sleep $((i*5))
          done
          echo "::error::trivy install failed after 5 attempts"; exit 1

      - name: Scan for fixable HIGH/CRITICAL CVEs
        # --ignore-unfixed keeps the gate ACTIONABLE: it fails only when a fix is
        # actually available (bump the base or a package), never on an upstream
        # CVE with no patch yet — so a green scan means "nothing to fix", not
        # "nothing found". Widen severity or drop --ignore-unfixed for an audit;
        # move this job to schedule-only (add an `if`) if PR noise appears.
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            --format table \
            runner:scan

  # S3 — supply-chain provenance. An ISOLATED publish job (kept separate from the
  # functional/scan lanes for the same reason security-scan is, ci.yml above) that,
  # for a push to main, publishes the image to GHCR and produces ATTESTABLE
  # PROVENANCE: a signed image, a signed SBOM, and a SLSA build-provenance
  # attestation binding the digest to THIS workflow + commit. So a deploy can prove
  # it runs the exact artifact CI built, and an auditor can enumerate every component
  # from a signed document.
  #
  # KEYLESS by design (Sigstore/Fulcio via the job's OIDC token) — no long-lived
  # signing key to store, preserving the runner's minimal-secret-footprint stance.
  #
  # It is PUBLISH-TIME ONLY: it never runs on pull_request or the weekly schedule, so
  # a Sigstore/Fulcio outage can never red the PR lane (mirrors keeping the CVE scan
  # separate) — and fork PRs cannot mint an OIDC token anyway. Its first LIVE proof is
  # therefore the post-merge run on main, validated on-target by `deploy.sh
  # verify-image` before the signed image is trusted (docs/DEPLOY.md).
  publish:
    name: publish + sign + SBOM (GHCR)
    # Only on a push to main (the branch prod deploys from — see deploy/README.md) or
    # a manual dispatch. Gated behind the correctness + containment lanes so a failed
    # unit/fuzz/smoke build is never published or signed.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [test, fuzz, runner-smoke]
    runs-on: ubuntu-latest
    # Narrowly scoped OIDC + registry writes, job-level ONLY — the workflow's
    # top-level `contents: read` stays intact for every other job. No
    # `attestations: write`: the signature, SBOM, AND provenance are all written to
    # GHCR by cosign (packages: write + Fulcio OIDC), not GitHub's attestation API —
    # which is unavailable for user-owned private repos anyway.
    permissions:
      contents: read   # checkout
      packages: write  # push the image + cosign sig/attestations to GHCR
      id-token: write  # keyless cosign (Fulcio OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once and push by digest. provenance:false keeps a single, plain image
      # manifest (not a buildkit attestation index) so the digest we sign is exactly
      # the image a deploy pulls — our own SLSA attestation below is the signed
      # provenance, not buildkit's unsigned one.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Sign the immutable digest keyless. This is the signature `cosign verify`
      # checks on deploy (docs/DEPLOY.md / deploy.sh verify-image).
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Install trivy (SBOM generator)
        # Same installer + auth + retry rationale as the security-scan job above.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                 | sh -s -- -b /usr/local/bin && trivy --version; then
              exit 0
            fi
            echo "trivy install attempt $i failed; retrying in $((i*5))s..."; sleep $((i*5))
          done
          echo "::error::trivy install failed after 5 attempts"; exit 1

      # A standard SPDX-json Bill of Materials of the SHIPPED image (bases + every
      # pinned toolchain: python/node/gcc/go/openjdk/nsjail libs). trivy authenticates
      # to GHCR via the docker login above to pull the just-pushed digest.
      - name: Generate SBOM (SPDX-json)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: trivy image --quiet --format spdx-json --output sbom.spdx.json "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Upload SBOM as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json

      # Attach the SBOM to the digest as a keyless-signed attestation, so the
      # inventory travels WITH the image and is itself verifiable.
      - name: Attest the SBOM (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "ghcr.io/${{ github.repository }}@${DIGEST}"

      # SLSA build-provenance bound to the digest, workflow, and commit, written to
      # GHCR with cosign (the spec's `cosign attest --type slsaprovenance` path).
      # NOT GitHub's actions/attest-build-provenance: that persists via the GitHub
      # attestations API, which returns "Feature not available for user-owned
      # private repositories" — so we use the same keyless, registry-stored
      # mechanism as the signature and SBOM, verifiable identically with cosign and
      # unaffected by that restriction. jq builds the predicate so it is always
      # valid JSON regardless of expansion.
      - name: Attest SLSA build-provenance to the registry (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          SERVER: ${{ github.server_url }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -n \
            --arg builder "$SERVER/$REPO/.github/workflows/ci.yml@$REF" \
            --arg uri "git+$SERVER/$REPO@$REF" \
            --arg sha "$SHA" \
            --arg run "$RUN" \
            --arg event "$EVENT" \
            '{
              buildType: "https://actions.github.io/buildtypes/workflow/v1",
              builder: { id: $builder },
              invocation: {
                configSource: { uri: $uri, digest: { sha1: $sha }, entryPoint: ".github/workflows/ci.yml" },
                environment: { github_event_name: $event, github_run: $run }
              },
              metadata: { buildInvocationID: $run }
            }' > provenance.json
          cat provenance.json
          cosign attest --yes --type slsaprovenance --predicate provenance.json "ghcr.io/${REPO}@${DIGEST}"
