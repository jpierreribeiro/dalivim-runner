name: CI

# F-B validation gate. The unit suite proves the arg-builder and the sandbox
# dial state machine; the runner-smoke job proves the REAL nsjail binary boots
# and contains untrusted code inside the shipped Docker image. The errno=11
# incident taught the lesson these jobs encode: green unit tests with mocked
# containment are not evidence that the binary jails anything on the target.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-run of the security gates so base-image drift and CVEs disclosed
    # AFTER a merge are caught even when no code changes — the "periodically"
    # half of §4.4 ("rodado no CI e periodicamente"). On this cadence the escape
    # corpus (runner-smoke) and the image CVE scan (security-scan) both fire; a
    # regression in containment or a newly-fixable HIGH/CRITICAL CVE turns the
    # scheduled run red without waiting for the next push.
    - cron: '17 6 * * 1' # Mondays 06:17 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  runner-smoke:
    name: nsjail smoke + escape corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runner image (compiles nsjail from source)
        run: docker build -t runner:smoke .

      # Ubuntu 24.04 (what ubuntu-latest now is) ships
      # kernel.apparmor_restrict_unprivileged_userns=1, an AppArmor mediation
      # that strips CAP_SYS_ADMIN inside unprivileged user namespaces created by
      # unconfined processes — which makes nsjail's own mount setup
      # (`mount('/','/',MS_REC|MS_PRIVATE)`) fail with EPERM. This sysctl is a
      # host-kernel global, NOT container-scoped, so --security-opt
      # apparmor=unconfined on the container cannot lift it; it must be cleared on
      # the runner host (GitHub-hosted runners allow passwordless sudo). This
      # relaxes the CI RUNNER HOST, not the inner jail, and is a property of the
      # runner's OS rather than the production target.
      - name: Allow unprivileged-userns mounts on the runner host (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Boot the shipped image under target-like resource limits with
      # RUNNER_SANDBOX=require, so a failed nsjail boot probe crashes the
      # container instead of silently downgrading to the netns backend.
      #
      # Containment relaxations, and why each is the minimum needed for nsjail to
      # build its per-run jails — all applied to the OUTER container/host only:
      #   --security-opt seccomp=unconfined   default profile blocks the
      #                                        CLONE_NEWUSER unshare nsjail needs
      #                                        to create its user namespace
      #   --security-opt apparmor=unconfined  docker-default apparmor denies the
      #                                        mount ops nsjail performs to build
      #                                        the read-only rootfs + tmpfs /tmp
      #   (host sysctl above)                 lifts Ubuntu 24.04's userns mount
      #                                        restriction
      # None of these add capabilities, and the container still runs as the
      # non-root `runner` user. The INNER per-run jail is unaffected: every
      # submission still gets its own userns/pid/net/mount namespaces, a read-only
      # rootfs, a size-capped tmpfs /tmp, the seccomp denylist, no_new_privs, and
      # per-jail rlimits. The escape corpus below is the proof the jail is intact.
      - name: Boot under target-like limits (RUNNER_SANDBOX=require)
        run: |
          docker run -d --name runner \
            --pids-limit=512 \
            --cpus=1 --memory=512m \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -e RUNNER_ENV=development \
            -e RUNNER_SANDBOX=require \
            -e GOMAXPROCS=1 \
            -p 8090:8090 \
            runner:smoke

      - name: Wait for /healthz (fail-closed boot proves nsjail probe passed)
        run: |
          for i in $(seq 1 40); do
            if curl -fs localhost:8090/healthz >/dev/null; then
              echo "healthz up after $((i))/40 tries"; exit 0
            fi
            if ! docker ps --filter name=runner --filter status=running -q | grep -q .; then
              echo "::error::runner container exited during boot — nsjail require probe failed"
              docker logs runner 2>&1 || true
              exit 1
            fi
            sleep 0.5
          done
          echo "::error::/healthz never came up"; docker logs runner 2>&1 || true; exit 1

      # The boot log is the source of truth that the REAL jail engaged. With
      # RUNNER_SANDBOX=require the daemon cannot reach this state on the netns
      # fallback, but we assert the log line explicitly so a future silent
      # downgrade fails the gate loudly.
      - name: Assert boot log shows nsjail ENABLED
        run: |
          docker logs runner 2>&1 | tee /tmp/boot.log
          if ! grep -q "nsjail ENABLED" /tmp/boot.log; then
            echo "::error::boot log does not show 'nsjail ENABLED' — sandbox did not engage"
            exit 1
          fi

      - name: Real POST /run (Python) — print(2+2) => success / "4\n"
        run: ./scripts/smoke-run.sh python 'print(2+2)' $'4\n'

      - name: Real POST /run (JavaScript) — console.log(2+2) => success / "4\n"
        run: ./scripts/smoke-run.sh javascript 'console.log(2+2)' $'4\n'

      # F-C acceptance criterion: JS must INHERIT the jail, not merely run. A Node
      # submission writing outside the tmpfs /tmp is denied by the SAME read-only
      # rootfs that contains Python — proof the containment is language-agnostic
      # (it lives in the sandbox seam, not the runtime).
      - name: JS inherits the jail — host write denied (read-only rootfs)
        run: ./scripts/smoke-run.sh javascript 'try{require("fs").writeFileSync("/usr/pwned","x");console.log("WRITTEN")}catch(e){console.log("denied")}' $'denied\n'

      # F-D: compiled languages compile in one jail and run the STATIC artifact in
      # a separate, minimal-rootfs jail. Prove the full two-phase path end to end.
      - name: Real POST /run (C) — compile + run => success / "4\n"
        run: ./scripts/smoke-run.sh c $'#include <stdio.h>\nint main(void){ printf("4\\n"); return 0; }' $'4\n'

      - name: Real POST /run (C++) — compile + run => success / "4\n"
        run: ./scripts/smoke-run.sh cpp $'#include <iostream>\nint main(){ std::cout << 2+2 << "\\n"; }' $'4\n'

      # A compile failure must short-circuit to compile_error WITHOUT executing.
      - name: C compile error => status compile_error (nothing executed)
        run: ./scripts/smoke-run.sh c 'int main(void){ return }' '' compile_error

      # The compiled run jail is minimal-rootfs: no toolchain is present, so a
      # submission cannot re-invoke the compiler at runtime (D-4). execv of gcc
      # must fail — the program reports the failure rather than compiling anything.
      - name: C run jail has no toolchain (execv gcc fails)
        run: ./scripts/smoke-run.sh c $'#include <unistd.h>\n#include <stdio.h>\nint main(void){ execl("/usr/bin/gcc","gcc",(char*)0); printf("no-gcc\\n"); return 0; }' $'no-gcc\n'

      # ---- G1 executor-robustness acceptance on the shipped image ----

      # G1.1: ordinary C using <math.h> now links libm (-lm rendered AFTER {src})
      # instead of failing as a bogus compile_error — the exact program that
      # regressed during F-D bring-up. `volatile` defeats gcc -O2 constant-folding
      # so a real call to sqrt is emitted and the link against libm is exercised.
      - name: G1.1 C <math.h> links libm => success / "4\n"
        run: ./scripts/smoke-run.sh c $'#include <stdio.h>\n#include <math.h>\nint main(void){ volatile double x = 16.0; printf("%d\\n", (int)sqrt(x)); return 0; }' $'4\n'

      # G1.2: compile_timeout_ms is now honoured (was silently ignored). A 1 ms
      # compile budget cannot finish any real compile, so it deterministically
      # short-circuits to compile_error [compile timed out]; before the fix the
      # field was a no-op and the program would have compiled and succeeded.
      - name: G1.2 compile_timeout_ms honoured => compile_error [compile timed out]
        run: |
          body="$(jq -nc '{language:"c",source_code:"int main(void){return 0;}",compile_timeout_ms:1}')"
          resp="$(curl -fsS localhost:8090/run -H 'content-type: application/json' -d "$body")"
          echo "$resp" | jq '{status, compile_output}'
          echo "$resp" | jq -e '.status=="compile_error" and (.compile_output|contains("[compile timed out]"))' >/dev/null \
            || { echo "::error::compile_timeout_ms not honoured"; exit 1; }

      # G1.3: stdin has its own cap, independent of the source budget. ~40k ints
      # (well over the old 64 KiB body slack) are summed to prove a large judge
      # input flows end to end.
      - name: G1.3 large stdin (>64 KiB) flows end to end => success
        run: |
          SMOKE_STDIN="$(yes 1 | head -n 40000)" \
            ./scripts/smoke-run.sh c $'#include <stdio.h>\nint main(void){ long s=0,x; while(scanf("%ld",&x)==1) s+=x; printf("%ld\\n", s); return 0; }' $'40000\n'

      # G1.3: oversized stdin (> RUNNER_MAX_STDIN_BYTES, default 1 MB) is rejected
      # at the transport layer with 400 — a bad request, not a run outcome.
      - name: G1.3 oversized stdin => 400
        run: |
          big="$(head -c 1100000 /dev/zero | tr '\0' 'x')"
          code="$(jq -nc --arg s "$big" '{language:"python",source_code:"print(1)",stdin:$s}' \
            | curl -sS -o /dev/null -w '%{http_code}' localhost:8090/run -H 'content-type: application/json' -d @-)"
          echo "http_code=$code"
          [ "$code" = "400" ] || { echo "::error::oversized stdin not rejected (got $code)"; exit 1; }

      # G1.4: an unbounded print loop is KILLED the moment it crosses the output
      # cap (SIGKILL of the process group in the REAL jail) and classified
      # output_limit_exceeded, ending far short of the 8 s deadline — not
      # truncated-and-left-running. Proven on both run paths: Python (interpreted)
      # and C (the static-artifact run jail).
      - name: G1.4 Python output flood => output_limit_exceeded, killed under deadline
        run: |
          src=$'while True:\n    print("x" * 1024)'
          body="$(jq -nc --arg s "$src" '{language:"python",source_code:$s,timeout_ms:8000}')"
          resp="$(curl -fsS localhost:8090/run -H 'content-type: application/json' -d "$body")"
          echo "$resp" | jq '{status, duration_ms, stdout_len:(.stdout|length)}'
          echo "$resp" | jq -e '.status=="output_limit_exceeded" and .duration_ms < 4000' >/dev/null \
            || { echo "::error::Python flood not killed fast as output_limit_exceeded"; exit 1; }

      - name: G1.4 C output flood => output_limit_exceeded, killed under deadline
        run: |
          src=$'#include <stdio.h>\nint main(void){ for(;;) putchar(\'x\'); return 0; }'
          body="$(jq -nc --arg s "$src" '{language:"c",source_code:$s,timeout_ms:8000}')"
          resp="$(curl -fsS localhost:8090/run -H 'content-type: application/json' -d "$body")"
          echo "$resp" | jq '{status, duration_ms, stdout_len:(.stdout|length)}'
          echo "$resp" | jq -e '.status=="output_limit_exceeded" and .duration_ms < 4000' >/dev/null \
            || { echo "::error::C flood not killed fast as output_limit_exceeded"; exit 1; }

      # Regression: output strictly under the cap is still a clean success with
      # full output (the kill path must not fire early).
      - name: G1.4 output under the cap => success, full output
        run: ./scripts/smoke-run.sh python 'print("y" * 1000)' "$(printf 'y%.0s' $(seq 1000))"$'\n'

      # ---- G2.1 Go (static-compiled) on the shipped image ----

      # Ordinary Go: goroutines + channels + a stdlib sort, compiled in the compile
      # jail (seeding its GOCACHE from the pre-warmed /opt/gocache) and run as a
      # static artifact in the minimal-rootfs run jail — proving the whole two-jail
      # Go path end to end.
      - name: G2.1 Go success (goroutines + channels + sort) => "6\n"
        run: |
          src=$'package main\nimport ("fmt"; "sort")\nfunc main(){\n ch := make(chan int, 3)\n for _, v := range []int{3, 1, 2} { go func(x int){ ch <- x }(v) }\n s := []int{}\n for i := 0; i < 3; i++ { s = append(s, <-ch) }\n sort.Ints(s)\n fmt.Println(s[0] + s[1] + s[2])\n}'
          ./scripts/smoke-run.sh go "$src" $'6\n'

      # Go reads stdin like any other run path (shared execute()).
      - name: G2.1 Go reads stdin => sum
        run: |
          src=$'package main\nimport ("bufio"; "fmt"; "os"; "strconv")\nfunc main(){\n sc := bufio.NewScanner(os.Stdin)\n n := 0\n for sc.Scan() { v, _ := strconv.Atoi(sc.Text()); n += v }\n fmt.Println(n)\n}'
          SMOKE_STDIN="$(printf '10\n20\n12\n')" ./scripts/smoke-run.sh go "$src" $'42\n'

      # Go inherits the jail's empty netns: any outbound dial fails, so egress is
      # contained (the program reports "blocked", never "OPEN").
      - name: G2.1 Go egress contained (empty netns) => "blocked\n"
        run: |
          src=$'package main\nimport ("fmt"; "net"; "time")\nfunc main(){\n _, err := net.DialTimeout("tcp", "1.1.1.1:80", 2*time.Second)\n if err != nil { fmt.Println("blocked") } else { fmt.Println("OPEN") }\n}'
          ./scripts/smoke-run.sh go "$src" $'blocked\n'

      # Go infinite loop is stopped by the wall/CPU limit, reported as timeout.
      - name: G2.1 Go infinite loop => timeout
        run: |
          src=$'package main\nfunc main(){ for {} }'
          body="$(jq -nc --arg s "$src" '{language:"go",source_code:$s,timeout_ms:2000}')"
          resp="$(curl -fsS localhost:8090/run -H 'content-type: application/json' -d "$body")"
          echo "$resp" | jq '{status, duration_ms}'
          echo "$resp" | jq -e '.status=="timeout"' >/dev/null \
            || { echo "::error::Go infinite loop not stopped by timeout"; exit 1; }

      # A Go compile error short-circuits to compile_error WITHOUT executing.
      - name: G2.1 Go compile error => compile_error (nothing executed)
        run: ./scripts/smoke-run.sh go $'package main\nfunc main(){ undefined() }' '' compile_error

      # F-D follow-up: the static run jail can take a tight seccomp ALLOWLIST
      # (DEFAULT KILL) instead of the shared denylist. Prove on a dedicated
      # RUNNER_STATIC_SECCOMP=enforce container that (a) the kafel allowlist
      # compiles and (b) it is sufficient for ordinary C and C++ programs — a run
      # killed by SIGSYS would come back != success. A separate container because
      # enforce changes the run jail for every compiled run (the execl test above
      # would be SIGSYS-killed, not ENOENT).
      - name: Static seccomp allowlist — enforce mode runs C/C++
        run: |
          docker run -d --name runner-seccomp \
            --pids-limit=512 --cpus=1 --memory=512m \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -e RUNNER_ENV=development \
            -e RUNNER_SANDBOX=require \
            -e RUNNER_STATIC_SECCOMP=enforce \
            -e GOMAXPROCS=1 \
            -p 8092:8090 \
            runner:smoke
          for i in $(seq 1 40); do
            if curl -fs localhost:8092/healthz >/dev/null; then break; fi
            if ! docker ps --filter name=runner-seccomp --filter status=running -q | grep -q .; then
              echo "::error::runner-seccomp exited during boot"; docker logs runner-seccomp 2>&1 || true; exit 1
            fi
            sleep 0.5
          done
          docker logs runner-seccomp 2>&1 | grep -q "static seccomp ALLOWLIST enforced" \
            || { echo "::error::enforce mode did not engage"; docker logs runner-seccomp 2>&1 || true; exit 1; }
          # On a SIGSYS kill (DEFAULT KILL) the kernel audit logs syscall=NNN to the
          # host dmesg — dump it so a missing allowlist entry is self-diagnosing.
          seccomp_run() {
            RUNNER_URL=http://localhost:8092 ./scripts/smoke-run.sh "$@" || {
              echo "::error::allowlist rejected a needed syscall — recent seccomp audit lines:";
              sudo dmesg | grep -iE 'seccomp|type=1326' | tail -20 || true;
              return 1;
            }
          }
          seccomp_run c $'#include <stdio.h>\nint main(void){ printf("4\\n"); return 0; }' $'4\n'
          seccomp_run cpp $'#include <iostream>\nint main(){ std::cout << 2+2 << "\\n"; }' $'4\n'
          docker rm -f runner-seccomp

      - name: Escape corpus — every submission must be contained, host survives
        run: ./scripts/smoke-escape.sh

      # Backpressure (R5 / F-A) on the shipped image. A dedicated container with
      # RUNNER_MAX_CONCURRENT_RUNS=1 (on port 8091) makes saturation
      # deterministic: firing several concurrent runs proves the excess is shed
      # immediately with 503 + Retry-After instead of queueing or knocking the
      # daemon over. Independent of the jail, but run through it (SANDBOX=require).
      - name: Backpressure — 503 + Retry-After under a low concurrency cap
        run: |
          docker run -d --name runner-bp \
            --pids-limit=512 --cpus=1 --memory=512m \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -e RUNNER_ENV=development \
            -e RUNNER_SANDBOX=require \
            -e RUNNER_MAX_CONCURRENT_RUNS=1 \
            -e GOMAXPROCS=1 \
            -p 8091:8090 \
            runner:smoke
          for i in $(seq 1 40); do
            if curl -fs localhost:8091/healthz >/dev/null; then break; fi
            if ! docker ps --filter name=runner-bp --filter status=running -q | grep -q .; then
              echo "::error::runner-bp exited during boot"; docker logs runner-bp 2>&1 || true; exit 1
            fi
            sleep 0.5
          done
          RUNNER_URL=http://localhost:8091 ./scripts/smoke-stress.sh 1

      - name: Runner logs (always)
        if: always()
        run: |
          echo "=== runner ==="; docker logs runner 2>&1 || true
          echo "=== runner-bp ==="; docker logs runner-bp 2>&1 || true
          echo "=== runner-seccomp ==="; docker logs runner-seccomp 2>&1 || true

      - name: Teardown
        if: always()
        run: docker rm -f runner runner-bp runner-seccomp || true

  # §4.5(c) — image CVE scan. A separate job (not a step in runner-smoke) so a
  # CVE finding gives a clean, independent signal instead of muddying the
  # functional/containment smoke result, and so it can run on its own cadence via
  # the weekly schedule above. Scans the SHIPPED image, so it also covers the
  # runtimes and nsjail runtime libs the Dockerfile installs (and the Node/gcc
  # toolchains F-C/F-D will add).
  security-scan:
    name: image CVE scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runner image
        run: docker build -t runner:scan .

      - name: Install trivy
        # Official installer, pinned to /usr/local/bin. Avoids depending on a
        # marketplace-action tag existing; the vuln DB is pulled at scan time.
        #
        # The installer resolves trivy's latest tag via the GitHub API; unauthenticated
        # that call is IP-rate-limited on shared runners and returns an empty tag
        # ("unable to find ''"), failing the job for a reason unrelated to any CVE. Pass
        # GITHUB_TOKEN so the lookup is authenticated, and retry with backoff so a
        # transient blip doesn't red the gate.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                 | sh -s -- -b /usr/local/bin && trivy --version; then
              exit 0
            fi
            echo "trivy install attempt $i failed; retrying in $((i*5))s..."; sleep $((i*5))
          done
          echo "::error::trivy install failed after 5 attempts"; exit 1

      - name: Scan for fixable HIGH/CRITICAL CVEs
        # --ignore-unfixed keeps the gate ACTIONABLE: it fails only when a fix is
        # actually available (bump the base or a package), never on an upstream
        # CVE with no patch yet — so a green scan means "nothing to fix", not
        # "nothing found". Widen severity or drop --ignore-unfixed for an audit;
        # move this job to schedule-only (add an `if`) if PR noise appears.
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            --format table \
            runner:scan
